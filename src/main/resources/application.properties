spring.application.name=UrlShortener


spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/url?ApplicationName=UrlShortener}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:password}
spring.datasource.hikari.maximum-pool-size=3

spring.data.redis.url=${SPRING_REDIS_URL:redis://localhost:6379}
spring.data.redis.client-name=${SPRING_REDIS_CLIENT_NAME:UrlShortener}

spring.data.redis.repositories.enabled=false

spring.jpa.hibernate.ddl-auto=validate

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=health,info,metrics

app.frontend-url=${FRONTEND_URL:http://localhost:5173}

server.servlet.session.timeout=24h
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}

# Enable virtual threads for better throughput
spring.threads.virtual.enabled=true
spring.main.keep-alive=true