spring.application.name=UrlShortener

# Datasource (Postgres)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/url?ApplicationName=UrlShortener}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:password}
spring.datasource.hikari.maximum-pool-size=3

# Redis connection (used for sessions and application cache)
spring.data.redis.url=${SPRING_REDIS_URL:redis://localhost:6379}
spring.data.redis.client-name=${SPRING_REDIS_CLIENT_NAME:UrlShortener}
spring.data.redis.repositories.enabled=false

# Redis application cache
spring.cache.redis.time-to-live=30m
spring.cache.redis.cache-null-values=false
spring.cache.type=redis

# Database schema management
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.jpa.open-in-view=false

# Actuator
management.endpoints.web.exposure.include=health,info,metrics

# Frontend
app.frontend-url=${FRONTEND_URL:http://localhost:5173}

# Session management
server.servlet.session.timeout=24h
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}

# Virtual threads
spring.threads.virtual.enabled=true

# Keep JVM alive when only virtual threads remain
spring.main.keep-alive=true